services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};
    env_file:
      - .env.example
    ports:
      - "8080"
    depends_on:
      - postgres
    networks:
      - backend

  nginx:
    build:
      context: ./nginx
    ports:
      - "443:443"
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./webapp/Taskolith.WebApp/dist:/usr/share/nginx/html:ro
        - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - webapp
    networks:
      - backend

  webapp:
    build:
      context: ./webapp/Taskolith.WebApp
      dockerfile: ../Dockerfile
    image: taskolith-webapp:latest

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
